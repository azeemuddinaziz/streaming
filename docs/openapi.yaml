openapi: 3.0.3
info:
  title: StreamSouk API
  version: v1
  description: |
    Every API of StreamSouk v2 in one place, written by hand for import into Postman
    (see ticket #43). Keep it in step with the routes: any change to an endpoint, its
    auth or its responses updates this file in the same ticket.

    ## Setup in Postman
    1. Import this file (Import, then choose the file).
    2. Create an environment with two variables: `baseUrl` = `http://localhost:3000/api/v1`
       and `tusdUrl` = `http://localhost:8080`.
    3. Run **Accounts, Sign up** (or **Sign in**) once. The API answers with a `token`
       cookie, and Postman's cookie jar sends it on every later request to the same
       host. Cookies ignore ports, so the tusd calls are signed in too.
    4. The fallback is `Authorization: Bearer <token>`. The token is the value of the
       `token` cookie (30 days). There is no revoke; sign-out only clears the cookie.

    Every response carries an `X-Request-Id` header (generated by the API, never taken
    from the request); it names the one log event written for that request.

    Errors from the API are always JSON `{ "msg": "..." }` with the status shown on
    each request. The tusd hook and the tus calls are the exception (see Uploading
    and Internal).

    ## How uploading a Video works
    Video bytes never go through the API. Per file: (1) sign in; (2) create the upload
    on tusd with `Upload-Metadata: filename <base64 of the file name>` (tusd asks the
    API's `pre-create` hook, which needs your token and a filename); (3) send the bytes
    with PATCH (HEAD tells you the offset to resume from); (4) when the last byte
    lands, the `post-finish` hook turns the Upload into a private, processing Video on
    your Channel. Follow it in **Studio, My videos**. It becomes `READY` once the
    worker has processed it. Then give it a title, a description and a Visibility in
    **Studio, Edit details**.

    ## Background jobs (worker process, no HTTP)
    The worker (`pnpm worker`) runs these jobs from a queue kept in the app's Postgres.
    They cannot be called from Postman; they are listed here so the whole system is in one place.

    | Job | Trigger | What it does | On failure |
    | --- | --- | --- | --- |
    | `process-video` | Queued by the `post-finish` hook, and again by **Studio, Retry processing** | Downloads the original, encodes 6-second HLS Renditions (1080/720/480/360p, up to the source height) with a `master.m3u8`, makes a first-frame thumbnail, then marks the Video `READY` | Retried 3 times with backoff; after the last attempt the Video is `FAILED` (retry it from the studio) |
    | `discard-stale-uploads` | Hourly (`0 * * * *`, UTC) | Finds Uploads unfinished for over 24 hours, marks them abandoned, asks tusd to delete their bytes. The record stays | The claim is given back and the job fails, so it is retried |

servers:
  - url: "{{baseUrl}}"
    description: The API (default http://localhost:3000/api/v1)

tags:
  - name: Accounts
    description: Sign up, sign in and out, and who am I.
  - name: Uploading
    description: Sending a video file to tusd, and resuming it.
  - name: Studio
    description: The signed-in person's own Videos. Only the owner can use these; someone else's Video is 404.
  - name: Watching
    description: Open to anyone, signed in or not.
  - name: Discovering
    description: Public listings, open to anyone.
  - name: Internal
    description: Called by other processes, not by people. Listed to explain their behaviour.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
      description: Set by Sign up and Sign in. Postman's cookie jar sends it.
    bearerAuth:
      type: http
      scheme: bearer
      description: The same token, for callers that do not keep cookies.

  schemas:
    Error:
      type: object
      properties:
        msg:
          type: string
      example:
        msg: Video not found.
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string, description: "The account name; also the Channel's name." }
      example:
        id: 5b0f8f0e-5b8a-4c7e-9a52-3f3a2f1d9a10
        email: ada@example.com
        name: ada-lovelace
    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
      example:
        id: 0c1a4a52-2d7e-4f58-8a6e-8e3b2f9b6c11
        name: ada-lovelace
    Me:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        channel: { $ref: "#/components/schemas/Channel" }
    Status:
      type: string
      enum: [PROCESSING, READY, FAILED]
    Visibility:
      type: string
      enum: [PRIVATE, UNLISTED, PUBLIC]
    StudioVideo:
      type: object
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: "The title, else the Upload's filename." }
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/Status" }
        visibility: { $ref: "#/components/schemas/Visibility" }
        commentsEnabled: { type: boolean, description: "Comments are on for this Video." }
        createdAt: { type: string, format: date-time }
        thumbnailPath:
          type: string
          nullable: true
          description: A media address under /media/{token}/..., relative to the API host (prefix with the server origin).
      example:
        id: 7d3c0b9e-6f0a-4b1a-8d55-2a9f6e0c4a21
        label: holiday.mp4
        title: null
        description: null
        status: READY
        visibility: PRIVATE
        commentsEnabled: true
        createdAt: "2026-10-01T09:30:00.000Z"
        thumbnailPath: /api/v1/media/eyJhbGciOi.../videos/7d3c0b9e/thumbnail.jpg
    ShowcaseVideo:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        channelName: { type: string }
        thumbnailPath: { type: string, nullable: true }
    Comment:
      type: object
      description: A Comment, or a Reply when `parentId` is set. The text is plain; show it as text, never as markup.
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true, description: "The top-level Comment a Reply belongs to; null for a top-level Comment." }
        body: { type: string, nullable: true, maxLength: 1000, description: "Null on a placeholder." }
        authorName: { type: string, nullable: true, description: "Null on a placeholder." }
        isChannelOwner: { type: boolean, description: "The author owns the Video." }
        isAuthor: { type: boolean, description: "The caller wrote it, so they can edit and delete it." }
        hidden: { type: boolean, description: "Hidden by the owner. True only for the owner; an author is never told their Comment was hidden." }
        edited: { type: boolean, description: "The author changed the text after posting. The earlier wording is not kept." }
        deleted: { type: boolean, description: "A deleted Comment that still has Replies: a placeholder with no author and no text, closed to new Replies." }
        createdAt: { type: string, format: date-time }
        replyCount: { type: integer, description: "Visible Replies; always 0 on a Reply." }
      example:
        id: 3f2b6c1e-0d54-4c0a-9a7b-6f1d2e8a4b90
        parentId: null
        body: Lovely trip!
        authorName: grace-hopper
        isChannelOwner: false
        createdAt: "2026-10-02T10:00:00.000Z"
        isAuthor: false
        hidden: false
        edited: false
        deleted: false
        replyCount: 1
    ChannelVideo:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        thumbnailPath: { type: string, nullable: true }
  parameters:
    VideoId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: The Video's id.
  responses:
    Unauthenticated:
      description: No valid token.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { msg: User not Authenticated. }
    NotReadyForComments:
      description: The Video is not READY.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { msg: This video is not ready for comments. }
    NotFound:
      description: A missing or deleted Video, or one that is not yours.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { msg: Video not found. }

paths:
  # ---------------------------------------------------------------- Accounts
  /users/sign-up:
    post:
      tags: [Accounts]
      summary: Sign up
      description: |
        Creates the User and its Channel and signs the person in (sets the `token` cookie).
        The account name is 3 to 30 letters, digits and hyphens (no leading or trailing
        hyphen), unique regardless of case, and cannot be changed later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 3, maxLength: 30 }
                email: { type: string }
                password: { type: string, minLength: 8, maxLength: 128 }
            example:
              name: ada-lovelace
              email: ada@example.com
              password: correct horse battery
      responses:
        "201":
          description: Created and signed in. Sets the `token` cookie (httpOnly, 30 days).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400":
          description: Invalid name, email or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Account name must be 3 to 30 characters. }
        "409":
          description: The account name or the email is already taken.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: That account name is already taken. }
  /users/sign-in:
    post:
      tags: [Accounts]
      summary: Sign in
      description: Run this once; Postman then sends the `token` cookie on every request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            example:
              email: ada@example.com
              password: correct horse battery
      responses:
        "200":
          description: Signed in. Sets the `token` cookie.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401":
          description: Wrong email or password (the same answer for an unknown email).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Incorrect email or password. }
  /users/sign-out:
    post:
      tags: [Accounts]
      summary: Sign out
      description: Clears the cookie only. The token itself is not revoked.
      responses:
        "204": { description: "Cookie cleared." }
  /users/me:
    get:
      tags: [Accounts]
      summary: Who am I
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The signed-in User and their Channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # --------------------------------------------------------------- Uploading
  /files/:
    servers:
      - url: "{{tusdUrl}}"
        description: The tusd upload server (default http://localhost:8080), not the API.
    post:
      tags: [Uploading]
      summary: Create an upload (tus)
      description: |
        Starts a resumable upload on tusd. tusd asks the API's `pre-create` hook first, which
        needs your token (cookie or Bearer, forwarded by tusd) and a `filename` in the
        metadata. Without a token it answers 401, without a filename 400. The answer
        carries the new upload's address in the `Location` header; use it for HEAD and PATCH.
        Send the first bytes right away with a PATCH, or all at once by also setting the body
        and `Content-Type: application/offset+octet-stream`.
      parameters:
        - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer }
          description: Total size of the file in bytes.
        - name: Upload-Metadata
          in: header
          required: true
          schema: { type: string }
          description: "`filename <base64 of the name>`, for example `filename aG9saWRheS5tcDQ=` for holiday.mp4."
      responses:
        "201": { description: "Created. The `Location` header holds the upload's address." }
        "400": { description: "The upload has no `filename` metadata, or no size because `Upload-Defer-Length` was used (from the hook)." }
        "401": { description: "No valid token (from the hook)." }
  /files/{uploadId}:
    servers:
      - url: "{{tusdUrl}}"
        description: The tusd upload server, not the API.
    parameters:
      - { name: uploadId, in: path, required: true, schema: { type: string }, description: "The id at the end of the `Location` header." }
      - { name: Tus-Resumable, in: header, required: true, schema: { type: string, enum: ["1.0.0"] } }
    head:
      tags: [Uploading]
      summary: Ask where an upload stands (tus)
      description: The `Upload-Offset` response header says how many bytes tusd already has, so you know where to resume.
      responses:
        "200": { description: "Headers `Upload-Offset` and `Upload-Length`." }
        "404": { description: "Unknown or discarded upload." }
    patch:
      tags: [Uploading]
      summary: Send bytes (tus)
      description: |
        Appends bytes at `Upload-Offset`. When the last byte lands, the `pre-finish` hook checks
        you own the upload and `post-finish` creates the Video. Anyone else finishing it gets
        a refusal and creates nothing.
      parameters:
        - { name: Upload-Offset, in: header, required: true, schema: { type: integer } }
        - { name: Content-Type, in: header, required: true, schema: { type: string, enum: [application/offset+octet-stream] } }
      requestBody:
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: "Bytes accepted. `Upload-Offset` has the new offset." }
        "403": { description: "The last bytes arrived but the upload is not yours (from the `pre-finish` hook). The bytes stay and the Upload is discarded after 24 hours." }
        "404": { description: "Unknown upload (from the `pre-finish` hook)." }
        "409": { description: "Wrong offset; HEAD to find the right one." }
    delete:
      tags: [Uploading]
      summary: Terminate an upload (tus)
      description: Deletes the bytes. This is also what the hourly cleanup job asks of tusd.
      responses:
        "204": { description: "Terminated." }
        "404": { description: "Already gone." }
  /uploads/unfinished:
    get:
      tags: [Uploading]
      summary: My resumable uploads
      description: Uploads not completed, not abandoned and started under 24 hours ago. Shown in the web studio.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploads:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        filename: { type: string }
                        size: { type: integer }
                        createdAt: { type: string, format: date-time }
              example:
                uploads:
                  - id: 3e2f7f64-3c0a-4d3b-8f4e-0a1b2c3d4e5f
                    filename: holiday.mp4
                    size: 104857600
                    createdAt: "2026-10-10T08:00:00.000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }

  # ------------------------------------------------------------------ Studio
  /videos/mine:
    get:
      tags: [Studio]
      summary: My videos
      description: Every non-deleted Video on your Channel, with its processing status.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  videos:
                    type: array
                    items: { $ref: "#/components/schemas/StudioVideo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /videos/{id}:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    patch:
      tags: [Studio]
      summary: Edit details
      description: |
        Saves any of `title` (max 100), `description` (max 5000), `visibility` and `commentsEnabled`
        (true or false; Comments are on by default), whatever the
        Video's processing status. Text is trimmed and blank becomes null; a title equal to the
        Upload's filename is stored as null. A result that is UNLISTED or PUBLIC must have both a
        title and a description (400 otherwise), so clearing either on a non-private Video is
        refused too. While `commentsEnabled` is false, new Comments, Replies and edits are refused
        (409), Viewers see an empty list and no count, and the owner still sees, hides and deletes them;
        turning it on restores everything.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 5000 }
                visibility: { $ref: "#/components/schemas/Visibility" }
                commentsEnabled: { type: boolean }
            example:
              title: Holiday in Lisbon
              description: Three days of tram rides and pastries.
              visibility: PUBLIC
              commentsEnabled: true
      responses:
        "200":
          description: The saved details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  video:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string, nullable: true }
                      description: { type: string, nullable: true }
                      visibility: { $ref: "#/components/schemas/Visibility" }
                      commentsEnabled: { type: boolean }
              example:
                video:
                  id: 7d3c0b9e-6f0a-4b1a-8d55-2a9f6e0c4a21
                  title: Holiday in Lisbon
                  description: Three days of tram rides and pastries.
                  visibility: PUBLIC
                  commentsEnabled: true
        "400":
          description: Not a JSON object, a field too long or not text, an unknown visibility, a `commentsEnabled` that is not true or false, or UNLISTED/PUBLIC without a title and description.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Add a title and a description before making a video unlisted or public. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Changed elsewhere meanwhile; reload and try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      tags: [Studio]
      summary: Delete a video
      description: "Soft delete only (ADR 0001): the Video is flagged and vanishes everywhere, but no row or file is removed. Media addresses already issued keep working until they expire."
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
  /videos/{id}/thumbnail:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    put:
      tags: [Studio]
      summary: Replace the thumbnail
      description: |
        The body is the raw image (in Postman: Body, binary; set `Content-Type` to the image type),
        not multipart and not an Upload. At most 5 MB. Only a `READY` Video.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: Replaced.
          content:
            application/json:
              schema:
                type: object
                properties:
                  video:
                    type: object
                    properties:
                      id: { type: string }
                      thumbnailPath: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The Video is not READY yet.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: The thumbnail can be changed once the video has finished processing. }
        "413":
          description: Over 5 MB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: That image is over 5 MB. }
        "415":
          description: Empty body, not an image, or an image that cannot be read.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /videos/{id}/retry:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    post:
      tags: [Studio]
      summary: Retry processing
      description: Flips a `FAILED` Video back to `PROCESSING` and queues it again from the kept original.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              example: { msg: Processing started. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The Video is not FAILED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Only a failed video can be retried. }
        "503":
          description: Queueing failed; the Video is FAILED again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Processing could not be started. Try again in a moment. }

  # ---------------------------------------------------------------- Watching
  /videos/{id}/watch:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    get:
      tags: [Watching]
      summary: Watch a video
      description: |
        Open to anyone; a token, if sent, identifies you. A missing or deleted Video, or a PRIVATE
        one to anyone but its owner, is 404. A Video that is not READY reports `PROCESSING` to
        everyone but its owner (who also sees `FAILED`) and has no `playlistPath`. A READY one
        returns `playlistPath`: an address under `/media/{token}/...` valid for 6 hours.
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The Video.
          content:
            application/json:
              schema:
                type: object
                properties:
                  video:
                    type: object
                    properties:
                      id: { type: string }
                      title: { type: string, nullable: true }
                      description: { type: string, nullable: true }
                      status: { $ref: "#/components/schemas/Status" }
                      channelName: { type: string }
                      createdAt: { type: string, format: date-time }
                      views: { type: integer }
                      comments: { type: integer, description: "The Comments and Replies anyone sees together; deleted and hidden ones (and Replies under a hidden Comment) are left out. Absent while Comments are off, except for the owner." }
                      commentsEnabled: { type: boolean, description: "False while the owner has Comments off." }
                      isOwner: { type: boolean, description: "The caller owns the Video, so can hide its Comments." }
                      playlistPath: { type: string, description: "Only when READY. Host-relative, so it starts with /api/v1/media/." }
              example:
                video:
                  id: 7d3c0b9e-6f0a-4b1a-8d55-2a9f6e0c4a21
                  title: Holiday in Lisbon
                  description: Three days of tram rides and pastries.
                  status: READY
                  channelName: ada-lovelace
                  createdAt: "2026-10-01T09:30:00.000Z"
                  views: 12
                  comments: 3
                  commentsEnabled: true
                  isOwner: false
                  playlistPath: /api/v1/media/eyJhbGciOi.../master.m3u8
        "404": { $ref: "#/components/responses/NotFound" }
  /videos/{id}/views:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    post:
      tags: [Watching]
      summary: Count a view
      description: |
        The browser calls this after 30 seconds of playback (or at the end of a shorter Video).
        One View per Viewer per Video per UTC day; the owner's own watching is never counted.
        Anyone can call it, so a client can report falsely; there is no rate limit yet.
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Whether this call was counted, and the total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  counted: { type: boolean }
                  views: { type: integer }
              example: { counted: true, views: 13 }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The Video is not READY.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: This video is not ready to be watched. }
  /videos/{id}/comments:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    get:
      tags: [Watching]
      summary: List a video's Comments
      description: |
        Top-level Comments, newest first, 20 per page. Open to anyone who can watch the Video; a
        token, if sent, identifies you. A missing or deleted Video, or a PRIVATE one to anyone but
        its owner, is 404; a Video that is not READY is 409. A missing or invalid `page` is 1.
        Replies are loaded per Comment (see **List a Comment's Replies**). While the owner has Comments
        off, everyone but the owner gets an empty list.
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  page: { type: integer }
                  hasMore: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
    post:
      tags: [Watching]
      summary: Write a Comment or a Reply
      description: |
        Signed in only. `body` is plain text, trimmed, 1 to 1000 characters. With `parentId` it is a
        Reply; answering a Reply attaches to the same top-level Comment. The target must be a
        visible Comment of this Video, else 409. Same Video rules as listing; a PRIVATE Video takes
        Comments only from its owner. 409 too while the owner has Comments off.

        Rate limit: at most 5 Comments or Replies per User per minute, on any Video, counted from the
        Comment table (deleted and hidden ones count). The sixth is 429 with a `Retry-After` header
        (seconds). Checked last, so a request that would fail anyway reports its own error.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                parentId: { type: string, format: uuid, description: "The Comment to answer." }
            example: { body: Lovely trip! }
      responses:
        "201":
          description: The new Comment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/Comment" }
        "400":
          description: The body is missing, blank, not text or over 1000 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Write something before posting. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429":
          description: Five Comments or Replies already written in the last minute.
          headers:
            Retry-After:
              description: Seconds until another may be written.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: You are commenting too fast. Slow down and try again shortly. }
        "409":
          description: The Video is not READY or has Comments off, or the Comment to answer is missing, deleted or hidden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: That comment can no longer be answered. }
  /videos/{id}/comments/hidden:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
    get:
      tags: [Watching]
      summary: List the Comments you hid
      description: |
        The Video's owner only (anyone else is 404, signed out is 401). The Comments and Replies the
        owner hid themselves, newest first, 20 per page, with `total`. Replies hidden only because
        their parent is hidden are not listed. Same Video rules as listing Comments.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
                  page: { type: integer }
                  hasMore: { type: boolean }
                  total: { type: integer, description: How many Comments and Replies are hidden. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
  /videos/{id}/comments/{commentId}/hide:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Watching]
      summary: Hide a Comment or Reply
      description: |
        The Video's owner only; anyone else, or a missing or deleted Comment, is 404. A hidden
        Comment is gone for everyone except the owner (see **List the Comments you hid**) and its own
        author, who still sees it as normal and is not told. Hiding a top-level Comment hides its
        Replies with it. A hidden Comment cannot be answered (409 when writing a Reply to it). Hiding
        is not deletion, and repeating it changes nothing.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
  /videos/{id}/comments/{commentId}/unhide:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Watching]
      summary: Un-hide a Comment or Reply
      description: |
        The Video's owner only. Brings the Comment back, and with it its Replies, except Replies that
        were hidden on their own.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Visible again. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
  /videos/{id}/comments/{commentId}:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid }, description: The Comment's or Reply's id. }
    patch:
      tags: [Watching]
      summary: Edit your Comment
      description: |
        The author only, at any time. The text follows the writing rules (trimmed, 1 to 1000 characters).
        The Comment then shows `edited`; the earlier wording is not kept. Someone else's, a missing or a
        deleted Comment is 404, as is a Video the caller cannot watch; a Video that is not READY is 409,
        and so is one with Comments off.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
            example: { body: Lovely trip, honestly. }
      responses:
        "200":
          description: The changed Comment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  comment: { $ref: "#/components/schemas/Comment" }
        "400":
          description: The body is missing, blank, not text or over 1000 characters.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Write something before posting. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: A missing or deleted Comment or Video, someone else's Comment, or a PRIVATE Video that is not yours.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Comment not found. }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
    delete:
      tags: [Watching]
      summary: Delete your Comment
      description: |
        The author only. The Comment is flagged as deleted and nothing is removed (ADR 0001). With
        Replies it stays in the list as a placeholder (`deleted: true`, no author, no text, closed to
        new Replies, Replies kept); without, it disappears. A placeholder disappears when its last
        Reply is deleted. Deleted Comments and placeholders are not in the watch response's `comments` count.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404":
          description: A missing or already deleted Comment, someone else's Comment, or a Video the caller cannot watch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: Comment not found. }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
  /videos/{id}/comments/{commentId}/replies:
    parameters:
      - { $ref: "#/components/parameters/VideoId" }
      - { name: commentId, in: path, required: true, schema: { type: string, format: uuid }, description: A top-level Comment's id. }
    get:
      tags: [Watching]
      summary: List a Comment's Replies
      description: |
        Visible Replies to a top-level Comment, oldest first, all in one response. Same access as
        **List a video's Comments**; an unknown, non-top-level or fully gone Comment is 404. A deleted
        Comment's Replies can still be read while any is visible.
      security: [{}, { cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The Replies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replies:
                    type: array
                    items: { $ref: "#/components/schemas/Comment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotReadyForComments" }
  /media/{token}/{path}:
    get:
      tags: [Watching]
      summary: Fetch a playlist or media file
      description: |
        Normally followed by a player, not by hand: use the `playlistPath` from **Watch a video**
        (everything after `/api/v1/media/` is `{token}/{path}`). The token names the Video and
        lasts 6 hours; it cannot be revoked, so a Video made private stays playable through an
        already-issued token until it expires. Playlists (`.m3u8`) are streamed by the API;
        other files redirect (302) to a 5-minute signed storage address, or are streamed
        when the store cannot sign (local disk).
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: path, required: true, schema: { type: string }, description: "For example `master.m3u8`, or a rendition's playlist or segment." }
      responses:
        "200": { description: "A playlist or file." }
        "302": { description: "Redirect to a signed storage address." }
        "403":
          description: The token is bad or expired (get a fresh `playlistPath` from Watch a video).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { msg: This address has expired. }
        "404": { description: "An unsafe or missing path." }

