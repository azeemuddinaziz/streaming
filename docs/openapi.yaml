      tags: [Discovering]
      summary: Home page showcase
      description: PUBLIC, READY, non-deleted Videos of every Channel, newest first, 24 per page. A missing or invalid `page` is 1. Page numbers are offsets, so a Video published meanwhile shifts later pages by one.
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: One page.
