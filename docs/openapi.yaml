  # ---------------------------------------------------------------- Internal
  /:
    get:
      tags: [Internal]
      summary: Hello world
      description: A placeholder at the API root. Handy to check the server is up.
      responses:
        "200":
          description: Alive.
          content:
            application/json:
              example: { msg: Hello World! }
  /webhooks/tusd:
    post:
      tags: [Internal]
      summary: tusd hook receiver
      description: |
        Called by the tusd process, never by people. Always answers HTTP 200: tusd's hook protocol
        refuses an upload with `RejectUpload: true` and an `HTTPResponse` in the body, not with a
        non-2xx status. The hook is chosen by `Type`. Your token reaches it in the forwarded
        `Authorization` or `Cookie` header inside `Event.HTTPRequest.Header`.

        - `pre-create`: needs a valid token (401) and `filename` metadata (400).
        - `post-create`: writes the Upload record (idempotent, tusd retries hooks).
        - `pre-finish` and `post-finish`: only the owner may finish; `post-finish` creates the
          private, processing Video exactly once and queues `process-video`. tusd still sends
          `post-finish` after a refused `pre-finish`, so it checks again.
        - `post-receive`, `post-terminate`: accepted without action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Type:
                  type: string
                  enum: [pre-create, post-create, post-receive, pre-finish, post-finish, post-terminate]
                Event:
                  type: object
                  properties:
                    Upload:
                      type: object
                      properties:
                        ID: { type: string }
                        Size: { type: integer }
                        Offset: { type: integer }
                        MetaData: { type: object, additionalProperties: { type: string } }
                    HTTPRequest:
                      type: object
                      properties:
                        Method: { type: string }
                        URI: { type: string }
                        Header: { type: object, additionalProperties: { type: array, items: { type: string } } }
      responses:
        "200":
          description: "`{}` to let it proceed, or a rejection."
          content:
            application/json:
              examples:
                allowed:
                  value: {}
                rejected:
                  value:
                    RejectUpload: true
                    HTTPResponse:
                      StatusCode: 401
                      Body: '{"message":"..."}'
